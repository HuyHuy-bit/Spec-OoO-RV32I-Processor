<text x="516.5" y="576">load_store_prepare</text><text x="516.5" y="614">Decode + effective address</text><text x="516.5" y="633">Alignment / PMA / byte lanes</text><text x="516.5" y="652">Retained descriptor register</text></g></g></g><g data-cell-id="path"><g><rect x="734" y="257" width="760" height="620" fill="#ffffff" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(17, 17, 17);"><text x="750" y="291">memory_transaction_path</text></g></g><g data-cell-id="load"><g><rect x="784" y="327" width="270" height="100" fill="#f1f1f1" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 241, 241); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(17, 17, 17);"><text x="919" y="365">load_transaction</text><text x="919" y="384">Cacheable or MMIO load</text><text x="919" y="403">Held result / fault</text></g></g></g><g data-cell-id="store"><g><rect x="784" y="527" width="270" height="100" fill="#f1f1f1" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 241, 241); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(17, 17, 17);"><text x="919" y="565">committed_store</text><text x="919" y="584">Cacheable store</text><text x="919" y="603">Commit first, then drain</text></g></g></g><g data-cell-id="mmio"><g><rect x="784" y="727" width="270" height="100" fill="#f1f1f1" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 241, 241); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(17, 17, 17);"><text x="919" y="765.5">mmio_store_transaction</text><text x="919" y="783.5">MMIO store / local store fault</text><text x="919" y="801.5">Held result / fault</text></g></g></g><g data-cell-id="arb"><g><rect x="1244" y="477" width="210" height="190" fill="#f1f1f1" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 241, 241); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(17, 17, 17);"><text x="1349" y="531.5">data_port_arbiter</text><text x="1349" y="569.5">Single port owner</text><text x="1349" y="588.5">Request arbitration</text><text x="1349" y="607.5">Response routing</text><text x="1349" y="626.5">Protocol-fatal latch</text></g></g></g></g></g><g data-cell-id="caller"><g><rect x="24" y="282" width="230" height="240" fill="#ffffff" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(17, 17, 17);"><text x="139" y="345.5">Caller interface</text><text x="139" y="381.5">Instruction / PC / full ID</text><text x="139" y="399.5">PRF operands + readiness</text><text x="139" y="417.5">Raw ROB head ID / PC</text><text x="139" y="435.5">Accepted retire / fault / trap</text><text x="139" y="471.5">Core backend supplies it</text></g></g></g><g data-cell-id="target"><g><rect x="1574" y="507" width="155" height="125" fill="#ffffff" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(17, 17, 17);"><text x="1651.5" y="548">Data-memory</text><text x="1651.5" y="567">interface</text><text x="1651.5" y="605">External target</text></g></g></g><g data-cell-id="admission"><g><rect x="24" y="642" width="230" height="180" fill="#ffffff" stroke="#111111" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(17, 17, 17);"/></g><g><g fill="#111111" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(17, 17, 17);"><text x="139" y="693.5">Admission interface</text><text x="139" y="729.5">admit_valid + full ID</text><text x="139" y="747.5">No later store access fault</text><text x="139" y="783.5">Producer still required</text></g></g></g><g data-cell-id="hold"><g><rect x="369" y="702" width="340" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#111111" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(17, 17, 17);"><text x="369" y="729.5">Prepared instruction and operands stay owned</text><text x="369" y="746.5">until accepted retirement / trap, or legal cancel.</text></g></g></g><g data-cell-id="pathnote"><g><rect x="944" y="897" width="520" height="55" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#111111" font-family="Arial" text-anchor="start" font-size="15px" style="fill: rgb(17, 17, 17);"><text x="944" y="922">One engine owns the data port at a time.</text><text x="944" y="940">Cacheable is a PMA class, not a cache.</text></g></g></g><g data-cell-id="ownerlife"><g><rect x="369" y="962" width="1120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#111111" font-family="Arial" text-anchor="start" font-size="15px" style="fill: rgb(17, 17, 17);"><text x="369" y="989.5">Cached store: accepted serial retirement authorizes commit; the write drains afterward.</text><text x="369" y="1007.5">Fault: completion acceptance records the fault; only accepted trap entry releases its held result.</text></g></g></g><g data-cell-id="net1"><g><path d="M 254 327.6 L 364.19 327.43" fill="none" stroke="#111111" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(17, 17, 17);"/><path d="M 371.99 327.41 L 364.2 331.33 L 364.17 323.53 Z" fill="#111111" stroke="#111111" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(17, 17, 17); st